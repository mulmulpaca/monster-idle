<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 폰 화면 너비에 맞추고, 손가락으로 확대되지 않게 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>몬스터 아이들</title>
  <!-- 꾸미기 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <!-- 가진 코인 -->
    <p class="coins">🪙 <span id="coins">0</span></p>

    <!-- 레벨 표시 -->
    <h1 class="level">Lv. <span id="level">1</span></h1>

    <!-- 경험치 바: 바깥 상자(exp-bar) 안의 채워지는 막대(exp-fill) 길이를 바꿔서 표시 -->
    <div class="exp-row">
      <div class="exp-bar">
        <div class="exp-fill" id="exp-fill"></div>
      </div>
      <span class="exp-text" id="exp-text">0 / 10</span>
    </div>

    <!-- 몬스터 이름 (진화하면 바뀜) -->
    <p class="monster-name" id="monster-name">꼬물이</p>

    <!-- 몬스터: 이 영역을 탭하면 경험치가 올라감 -->
    <div class="monster-area" id="monster-area">
      <div class="monster" id="monster">🐣</div>
    </div>

    <!-- 안내 문구 (레벨업 때는 "레벨 업!"으로 잠깐 바뀜) -->
    <p class="message" id="message">몬스터를 탭하세요!</p>

    <!-- 코인을 쓰는 곳 (가격 글자는 game.js가 data.js 값을 넣어서 채움) -->
    <div class="actions">
      <button class="action-btn feed-btn" id="feed-btn" type="button">🍖 먹이 주기</button>
      <button class="action-btn egg-btn" id="egg-btn" type="button">🥚 알 뽑기</button>
    </div>
    <button class="dex-btn" id="dex-btn" type="button">📖 도감</button>

    <!-- 개발용 버튼들 (게임이 완성되면 없앨 예정, 글자는 game.js가 채움) -->
    <div class="dev-tools">
      <button class="dev-btn" id="add-exp-btn" type="button">🔧 경험치 +100</button>
      <button class="dev-btn" id="add-coins-btn" type="button">🔧 코인 +1000</button>
      <button class="dev-btn" id="skip-time-btn" type="button">🔧 1시간 지난 것처럼</button>
      <button class="dev-btn" id="reset-btn" type="button">🔧 초기화</button>
    </div>
  </main>

  <!-- 방치 보상 팝업: 평소에는 숨겨 둠(hidden), 보상이 있을 때만 보여 줌 -->
  <div class="popup-backdrop" id="offline-popup" hidden>
    <div class="popup">
      <p>자리를 비운 동안<br><strong id="offline-coins">0</strong>코인을 모았어요! 🪙</p>
      <button class="popup-btn" id="offline-ok-btn" type="button">받기</button>
    </div>
  </div>

  <!-- 뽑기 팝업: 알 흔들림 → 깨짐 → 결과 카드 (내용은 game.js가 채움) -->
  <div class="popup-backdrop" id="gacha-popup" hidden>
    <div class="popup gacha-box" id="gacha-box">
      <!-- 연출용 알 -->
      <div class="gacha-egg" id="gacha-egg">🥚</div>

      <!-- 결과 카드 (알이 깨진 뒤에 보임) -->
      <div class="gacha-result" id="gacha-result" hidden>
        <p class="gacha-rarity" id="gacha-rarity">일반</p>
        <div class="gacha-monster" id="gacha-monster">🐸</div>
        <p class="gacha-name">
          <span id="gacha-name">개굴이</span>
          <span class="gacha-new" id="gacha-new">NEW!</span>
        </p>
        <p class="gacha-note" id="gacha-note"></p>
        <div class="popup-buttons">
          <button class="popup-btn" id="gacha-use-btn" type="button">이 모습으로 키우기</button>
          <button class="popup-btn secondary" id="gacha-close-btn" type="button">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 도감 팝업: 수집률 + 기본 모습 버튼 + 등급별 몬스터 칸 (내용은 game.js가 채움) -->
  <div class="popup-backdrop" id="dex-popup" hidden>
    <div class="popup dex-popup">
      <h2 class="popup-title">📖 도감 <small id="dex-total">0 / 10 (0%)</small></h2>
      <p class="dex-summary" id="dex-rarity-summary"></p>

      <!-- 기본 모습(레벨에 따라 진화하는 모습)으로 돌아가는 버튼 -->
      <div class="dex-basic">
        지금 모습:
        <button class="dex-basic-btn" id="dex-basic-btn" type="button">🐣 기본 모습</button>
      </div>

      <!-- 등급별 제목과 몬스터 칸들 -->
      <div class="dex-sections" id="dex-sections"></div>

      <button class="popup-btn secondary" id="dex-close-btn" type="button">닫기</button>
    </div>
  </div>

  <!-- 몬스터 상세 팝업: 도감에서 몬스터를 누르면 위에 뜸 -->
  <div class="popup-backdrop" id="detail-popup" hidden>
    <div class="popup">
      <div class="detail-emoji" id="detail-emoji">🐸</div>
      <p class="detail-name" id="detail-name">개굴이</p>
      <p class="detail-rarity" id="detail-rarity">등급: 일반</p>

      <!-- 가진 몬스터만: 기록 -->
      <dl class="detail-records" id="detail-records">
        <dt>처음 얻은 날</dt>
        <dd id="detail-first"></dd>
        <dt>뽑힌 횟수</dt>
        <dd id="detail-count"></dd>
      </dl>
      <!-- 못 모은 몬스터만 -->
      <p class="detail-unknown" id="detail-unknown">아직 만나지 못했어요</p>

      <p class="detail-current" id="detail-current">지금 키우는 모습이에요 ✔</p>
      <div class="popup-buttons">
        <button class="popup-btn" id="detail-use-btn" type="button">이 모습으로 키우기</button>
        <button class="popup-btn secondary" id="detail-back-btn" type="button">뒤로</button>
      </div>
    </div>
  </div>

  <!-- 동작 파일 연결 (화면 요소가 다 만들어진 뒤에 읽도록 맨 아래에 둠) -->
  <!-- data.js(숫자·목록)를 먼저, game.js(동작)를 나중에 읽어야 함 -->
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
